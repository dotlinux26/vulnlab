name: lfi-rfi-lab

services:
  web:
    build: .
    container_name: lfi-rfi-web
    ports:
      - "7108:80"
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/log/apache2
      - /var/run/apache2
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    restart: "no"
    user: "1000:1000"
