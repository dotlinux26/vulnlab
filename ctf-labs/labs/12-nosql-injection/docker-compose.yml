name: nosql-injection-lab

services:
  web:
    build: .
    container_name: nosql-injection-web
    ports:
      - "7106:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: "no"
    user: "1000:1000"

  db:
    image: mongo:7
    container_name: nosql-injection-db
    command: mongod --bind_ip 0.0.0.0 --noauth
    restart: "no"
